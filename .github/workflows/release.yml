name: Publish desktop release

on:
  push:
    tags:
      - 'v*-dev.*'
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS-universal
          - os: windows-latest
            platform: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Confirm the tag is on the correct branch
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          git fetch origin main develop
          if [[ "$RELEASE_TAG" == *-dev.* ]]; then
            source_branch=origin/develop
          else
            source_branch=origin/main
          fi
          tag_sha=$(git rev-list -n 1 "$RELEASE_TAG")
          if ! git branch -r --contains "$tag_sha" | sed 's/^[* ]*//' | grep -Fxq "$source_branch"; then
            echo "Tag $RELEASE_TAG must point to $source_branch" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate stable version
        if: ${{ !contains(inputs.release_tag || github.ref_name, '-dev.') }}
        run: node scripts/validate-release-version.js "${RELEASE_TAG#v}"
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      - name: Set development version from tag
        if: contains(inputs.release_tag || github.ref_name, '-dev.')
        run: npm run set-dev-version -- "${RELEASE_TAG#v}"
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build-all
      - name: Check release signing credentials
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            required=(AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_SUBSCRIPTION_ID AZURE_ARTIFACT_SIGNING_ENDPOINT AZURE_ARTIFACT_SIGNING_ACCOUNT AZURE_ARTIFACT_SIGNING_PROFILE)
          else
            required=(APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_DEVELOPER_IDENTITY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID)
          fi
          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Signing secret is not configured: $name"
              missing=1
            fi
          done
          if [[ "$missing" == 1 ]]; then
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              echo 'Windows release blocked: configure Azure Artifact Signing secrets before publishing a Windows installer.' >&2
              exit 1
            fi
            echo 'Continuing with an unsigned macOS build. Configure Apple signing secrets for a trusted release.'
          fi
      - name: Import Apple signing certificate into temporary keychain
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_BASE64" || -z "$APPLE_CERTIFICATE_PASSWORD" ]]; then
            echo 'Apple signing certificate is not configured; continuing with an unsigned app.'
            exit 0
          fi
          certificate_path="$RUNNER_TEMP/msit-git-lab-signing.p12"
          keychain_path="$RUNNER_TEMP/msit-git-lab.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
      - name: Package Windows app before signing
        if: runner.os == 'Windows'
        run: |
          node scripts/prepare-icons.js
          npx electron-forge package --platform win32 --arch x64
        shell: pwsh
      - name: Authenticate to Azure with GitHub OIDC
        if: runner.os == 'Windows'
        uses: azure/login@93381592711f247e165c389ebb30b596c84cdc48 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows app with Azure Artifact Signing
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\out\MSIT Git Lab-win32-x64\msit-git-lab.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Create Windows installer from signed app
        if: runner.os == 'Windows'
        run: npx electron-forge make --from-package --platform win32 --arch x64
      - name: Sign Windows installer with Azure Artifact Signing
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\out\make\squirrel.windows\x64
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Create macOS release artifacts
        if: runner.os == 'macOS'
        run: npm run make
        env:
          APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: msit-git-lab-${{ matrix.platform }}
          path: out/make/**
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Prepare stable download filenames
        shell: bash
        run: |
          mkdir -p release-assets
          dmg=$(find release-artifacts -type f -name '*.dmg' -print -quit)
          setup=$(find release-artifacts -type f -name '*Setup.exe' -print -quit)
          zip=$(find release-artifacts -type f -name '*.zip' -print -quit)
          test -n "$dmg" || { echo 'macOS DMG is missing' >&2; exit 1; }
          test -n "$setup" || { echo 'Windows setup executable is missing' >&2; exit 1; }
          cp "$dmg" release-assets/MSIT-Git-Lab-macOS-universal.dmg
          cp "$setup" release-assets/MSIT-Git-Lab-Windows-x64-Setup.exe
          if [[ -n "$zip" ]]; then cp "$zip" release-assets/MSIT-Git-Lab-macOS-universal.zip; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-dev.') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*
